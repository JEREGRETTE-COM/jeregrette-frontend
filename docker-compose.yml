services:
  web:
    build:
      context: .
      args:
        # Adresse publique du site : inscrite dans le JavaScript à la construction.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://jeregrette.com}
    ports:
      - "3000:3000"
    environment:
      # Lues au démarrage : modifiables sans reconstruire l'image.
      API_URL: ${API_URL:-https://jeregrette-api.benrango.com/api}
      AVATAR_UPLOAD: ${AVATAR_UPLOAD:-0}
    restart: unless-stopped
